{% extends 'base.html' %}
{% block content%}
<h1>Home</h1>
<head>
    <style>
/* Container Layout */
.fab-container {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-top: 30px;
}

/* Base Button Styles */
.fab {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border-radius: 50px;
  font-weight: 600;
  font-size: 1rem;
  text-decoration: none;
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
  transition: all 0.3s ease;
}

.fab i {
  font-size: 1.3rem;
}

/* Hover Effects */
.fab:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  text-decoration: none;
}

/* Color overrides (optional) */
.fab.upload {
  background: linear-gradient(135deg, #43cea2, #185a9d);
}

.fab.upload:hover {
  background: linear-gradient(135deg, #11998e, #38ef7d);
}

.fab.fetch {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #fff;
}

.fab.fetch:hover {
  background: linear-gradient(135deg, #f7797d, #FBD786);
}

/* Responsive Design */
@media (max-width: 600px) {
  .fab {
    width: 100%;
    justify-content: center;
    font-size: 0.95rem;
    padding: 12px;
  }

  .fab-container {
    flex-direction: column;
    gap: 1rem;
    align-items: center;
  }
}
</style>
</head>
<div class="fab-container">
  <a href="{% url 'patients:enroll_patient' %}" class="fab upload">
    <i class="ri ri-upload-cloud-2-line"></i>
    <span>Upload Report</span>
  </a>
  <a href="{% url 'patients:verify_patient' %}" class="fab fetch">
    <i class="ri ri-database-2-line"></i>
    <span>Fetch Report</span>
  </a>
</div>
{% endblock%}
